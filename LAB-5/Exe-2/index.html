<!DOCTYPE html>
<html>
<head>
    <title>Library Book Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📚 Library Book Tracker</h1>

    <div class="form-section">
        <input type="number" id="bookId" placeholder="Book ID">
        <input type="text" id="title" placeholder="Title">
        <input type="text" id="author" placeholder="Author">
        <select id="status">
            <option value="">Select Status</option>
            <option value="Available">Available</option>
            <option value="Issued">Issued</option>
        </select>

        <button onclick="addBook()">Add</button>
        <button onclick="updateBook()">Update Status</button>
        <button onclick="deleteBook()">Delete</button>
    </div>

    <div id="message"></div>

    <table id="bookTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button class="load-btn" onclick="loadBooks()">Load Books</button>
</div>

<script src="script.js"></script>
</body>
</html>
