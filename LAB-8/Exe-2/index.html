<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Object Test</title>
</head>
<body>
    <h1>Object + Destructuring + Spread</h1>
    <p>Open Console to see the output!</p>

    <script>
        const student = {
            id: 8389,
            name: "Vardhan",
            department: "CSE with AI&ML",
            marks: 99
        };

        const { id, name, department, marks } = student;
        console.log(id, name, department, marks);

        const calculatedGrade = marks >= 90 ? "A+" : "B";

        const updatedStudent = {
            ...student,
            grade: calculatedGrade
        };

        console.log(updatedStudent);
    </script>
</body>
</html>
