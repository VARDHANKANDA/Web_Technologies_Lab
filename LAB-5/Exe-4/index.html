<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📦 Product Inventory System</h1>

    <div class="form-section">
        <input type="number" id="productId" placeholder="Product ID">
        <input type="text" id="productName" placeholder="Product Name">
        <input type="text" id="category" placeholder="Category">
        <input type="number" id="price" placeholder="Price">
        <input type="number" id="stock" placeholder="Stock Quantity">

        <button onclick="addProduct()">Add</button>
        <button onclick="updateProduct()">Update</button>
        <button onclick="deleteProduct()">Delete</button>
    </div>

    <div class="search-section">
        <input type="text" id="searchCategory" placeholder="Search by Category">
        <button onclick="searchByCategory()">Search</button>
        <button onclick="displayProducts(products)">Show All</button>
    </div>

    <div id="message"></div>

    <table id="inventoryTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price (₹)</th>
                <th>Stock</th>
                <th>Total Value (₹)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h3 id="totalInventory"></h3>
</div>

<script src="script.js"></script>
</body>
</html>
