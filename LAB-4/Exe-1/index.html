<!DOCTYPE html>
<html>
<head>
<title>Username Checker</title>
<style>
body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}
.card {
  background: rgba(255,255,255,0.1);
  padding:30px;
  border-radius:15px;
  backdrop-filter: blur(10px);
  width:300px;
  text-align:center;
}
input {
  padding:10px;
  width:100%;
  margin-bottom:10px;
}
button {
  padding:10px;
  width:100%;
  background:#00c6ff;
  border:none;
  color:white;
  cursor:pointer;
}
#message { margin-top:10px; font-weight:bold; }
.loader {
  display:none;
  border:4px solid #f3f3f3;
  border-top:4px solid #00c6ff;
  border-radius:50%;
  width:20px;
  height:20px;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="card">
  <h2>Register</h2>
  <input type="text" id="username" placeholder="Enter Username">
  <div class="loader" id="loader"></div>
  <div id="message"></div>
  <button id="submitBtn">Submit</button>
</div>

<script>
const input = document.getElementById("username");
const message = document.getElementById("message");
const loader = document.getElementById("loader");
const submitBtn = document.getElementById("submitBtn");

let available = false;

input.addEventListener("keyup", () => {
  const username = input.value.trim();
  if(username === "") return;

  loader.style.display = "block";
  message.textContent = "";

  fetch("users.json")
    .then(res => res.json())
    .then(data => {
      loader.style.display = "none";
      if(data.usernames.includes(username)){
        message.textContent = "Username already taken ❌";
        message.style.color = "red";
        available = false;
      } else {
        message.textContent = "Username available ✅";
        message.style.color = "lightgreen";
        available = true;
      }
    })
    .catch(() => {
      loader.style.display = "none";
      message.textContent = "Error checking username";
      message.style.color = "orange";
    });
});

submitBtn.addEventListener("click", (e)=>{
  if(!available){
    e.preventDefault();
    alert("Cannot submit. Username unavailable.");
  } else {
    alert("Form submitted successfully!");
  }
});
</script>

</body>
</html>
