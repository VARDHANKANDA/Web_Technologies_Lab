<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Feedback Survey</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top">
    <h1>🎓 Student Feedback Survey</h1>
    <p>Fill the survey and submit only after validation ✅</p>
  </header>

  <main class="container">
    <form id="surveyForm" class="card">
      <h2>Survey Form</h2>
      <p class="desc">Your responses help us improve the learning experience.</p>

      <div id="surveyContainer"></div>

      <button type="submit" id="submitBtn">Submit Survey</button>
      <p id="successMsg" class="success-msg"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
